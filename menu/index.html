<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <title>Наше меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-kicker">Меню на 30 дней</div>
          <h1 id="hero-title">Наше меню</h1>
        </div>
        <div class="hero-badge" id="hero-badge">🍽</div>
      </div>
      <div class="progress"><div class="progress-bar" id="hero-progress"></div></div>
      <div class="hero-sub" id="hero-sub"></div>
    </header>

    <nav class="tabs">
      <button data-tab="today" class="active"><span>🍽</span>Сегодня</button>
      <button data-tab="dishes"><span>📖</span>Блюда</button>
      <button data-tab="shopping"><span>🛒</span>Покупки</button>
      <button data-tab="settings"><span>⚙️</span>Ещё</button>
    </nav>

    <main>
      <section id="tab-today" class="tab active"></section>
      <section id="tab-dishes" class="tab"></section>
      <section id="tab-shopping" class="tab"></section>
      <section id="tab-settings" class="tab"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <strong id="modal-title"></strong>
        <button id="modal-close" class="icon-btn" aria-label="Закрыть">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
