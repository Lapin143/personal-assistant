<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <title>Ассистент</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=a1">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-kicker" id="hero-kicker">Семейный ассистент</div>
          <h1 id="hero-title">Ассистент</h1>
        </div>
        <div class="hero-badge">🏠</div>
      </div>
      <div class="hero-sub" id="hero-sub"></div>
    </header>

    <nav class="sections" id="sections"></nav>

    <main id="main"></main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <strong id="modal-title"></strong>
        <button id="modal-close" class="icon-btn" aria-label="Закрыть">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="app.js?v=a1"></script>
</body>
</html>
